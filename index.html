<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>めくれる本テンプレート</title>
  <style>
    :root {
      --bg: #f2eee8;
      --paper: #fffdf8;
      --ink: #333;
      --accent: #27364a;
      --shadow: rgba(0,0,0,.22);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
      background:
        radial-gradient(circle at top, rgba(255,255,255,.8), transparent 35%),
        var(--bg);
      color: var(--ink);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 24px;
    }

    header {
      text-align: center;
      line-height: 1.5;
    }

    header h1 {
      font-size: 20px;
      margin: 0;
      letter-spacing: .08em;
      color: var(--accent);
    }

    header p {
      margin: 6px 0 0;
      font-size: 13px;
      opacity: .75;
    }

    .book-wrap {
      width: min(92vw, 980px);
      aspect-ratio: 1.42 / 1;
      perspective: 2000px;
      position: relative;
    }

    .book {
      width: 100%;
      height: 100%;
      position: relative;
      filter: drop-shadow(0 18px 24px var(--shadow));
    }

    .cover-base {
      position: absolute;
      inset: 0;
      border-radius: 12px;
      background: linear-gradient(90deg, #e6ded2 0 49.6%, #d7cdbf 49.6% 50.4%, #fffaf0 50.4%);
      border: 1px solid rgba(0,0,0,.08);
      overflow: hidden;
    }

    .center-line {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 50%;
      width: 2px;
      transform: translateX(-50%);
      background: linear-gradient(to right, rgba(0,0,0,.16), rgba(255,255,255,.55), rgba(0,0,0,.12));
      z-index: 30;
      pointer-events: none;
    }

    .page {
      position: absolute;
      top: 0;
      width: 50%;
      height: 100%;
      background: var(--paper);
      transform-style: preserve-3d;
      transition: transform .75s ease, z-index .75s ease;
      transform-origin: left center;
      right: 0;
      border-radius: 0 12px 12px 0;
      box-shadow: inset 10px 0 18px rgba(0,0,0,.04), 0 4px 12px rgba(0,0,0,.12);
      cursor: pointer;
    }

    .page.flipped {
      transform: rotateY(-180deg);
    }

    .side {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 18px;
      background: var(--paper);
      border: 1px solid rgba(0,0,0,.06);
    }

    .front {
      border-radius: 0 12px 12px 0;
    }

    .back {
      transform: rotateY(180deg);
      border-radius: 12px 0 0 12px;
      background: #fffaf0;
    }

    .side img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      user-select: none;
      pointer-events: none;
    }

    .blank {
      width: 100%;
      height: 100%;
      border: 1px dashed rgba(0,0,0,.16);
      display: grid;
      place-items: center;
      text-align: center;
      font-size: 14px;
      color: rgba(0,0,0,.45);
      padding: 16px;
    }

    .controls {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: center;
    }

    button {
      appearance: none;
      border: 0;
      border-radius: 999px;
      padding: 10px 18px;
      background: var(--accent);
      color: white;
      font-size: 14px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,.16);
    }

    button:disabled {
      opacity: .35;
      cursor: not-allowed;
    }

    .counter 
      min-width: 110px;
      text-align: center;
      font-size: 14px;
      color: #555;
    }

    .hint {
      font-size: 12px;
      opacity: .7;
      text-align: center;
      line-height: 1.6;
    }

    @media (max-width: 700px) {
      body { padding: 16px; }
      .book-wrap {
        width: 94vw;
        aspect-ratio: .72 / 1;
      }
      .page, .cover-base {
        width: 100%;
      }
      .page {
        left: 0;
        right: auto;
        transform-origin: left center;
      }
      .center-line { display: none; }
      .cover-base {
        background: #fffaf0;
      }
      .side { padding: 10px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>めくれる本テンプレート</h1>
    <p>pagesフォルダに画像を入れて、このHTMLの画像リストを書き換えてください。</p>
  </header>

  <div class="book-wrap">
    <div class="book" id="book">
      <div class="cover-base"></div>
      <div class="center-line"></div>
    </div>
  </div>

  <div class="controls">
    <button id="prevBtn">← 前へ</button>
    <div class="counter" id="counter">0 / 0</div>
    <button id="nextBtn">次へ →</button>
  </div>

  <div class="hint">
    クリック、左右キー、ボタンでページをめくれます。<br>
    画像は jpg / png / webp / gif が使えます。
  </div>

  <script>
    /*
      使い方：
      1. pages フォルダに画像を入れる
      2. 下の images にファイル名を順番に書く
         例： "pages/01.jpg", "pages/02.jpg", "pages/03.png"
    */
    const images = [
      "pages/01.png",
      "pages/02.png",
      "pages/03.png",
      "pages/04.png",
      "pages/05.png",
      "pages/06.png",
      "pages/07.png",
      "pages/08.png",
      "pages/09.png",
      "pages/10.png",
      "pages/11.png"
    ];

    const book = document.getElementById("book");
    const counter = document.getElementById("counter");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");

    let current = 0;
    const sheets = [];

    function makeSide(src, className) {
      const side = document.createElement("div");
      side.className = "side " + className;

      if (src) {
        const img = document.createElement("img");
        img.src = src;
        img.alt = "";
        side.appendChild(img);
      } else {
        const blank = document.createElement("div");
        blank.className = "blank";
        blank.textContent = "空白ページ";
        side.appendChild(blank);
      }
      return side;
    }

    function buildBook() {
      const pageCount = Math.ceil(images.length / 2);

      for (let i = 0; i < pageCount; i++) {
        const page = document.createElement("div");
        page.className = "page";
        page.style.zIndex = pageCount - i;

        const frontSrc = images[i * 2];
        const backSrc = images[i * 2 + 1];

        page.appendChild(makeSide(frontSrc, "front"));
        page.appendChild(makeSide(backSrc, "back"));

        page.addEventListener("click", () => {
          if (i === current) nextPage();
          else if (i === current - 1) prevPage();
        });

        book.appendChild(page);
        sheets.push(page);
      }

      update();
    }

    function update() {
      sheets.forEach((page, index) => {
        if (index < current) {
          page.classList.add("flipped");
          page.style.zIndex = index + 1;
        } else {
          page.classList.remove("flipped");
          page.style.zIndex = sheets.length - index;
        }
      });

      counter.textContent = `${Math.min(current * 2, images.length)} / ${images.length}`;
      prevBtn.disabled = current === 0;
      nextBtn.disabled = current === sheets.length;
    }

    function nextPage() {
      if (current < sheets.length) {
        current++;
        update();
      }
    }

    function prevPage() {
      if (current > 0) {
        current--;
        update();
      }
    }

    nextBtn.addEventListener("click", nextPage);
    prevBtn.addEventListener("click", prevPage);

    document.addEventListener("keydown", (e) => {
      if (e.key === "ArrowRight") nextPage();
      if (e.key === "ArrowLeft") prevPage();
    });

    buildBook();
  </script>
</body>
</html>
