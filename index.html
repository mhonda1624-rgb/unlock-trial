<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UNLOCK Flipbook</title>
<style>
body{
  margin:0;
  background:#efe8dc;
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
}
h1{
  font-size:18px;
  color:#27364a;
  margin:14px 0 8px;
}
.viewer{
  width:min(96vw,1000px);
  height:72vh;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:0;
}
.page{
  background:#fffdf8;
  width:50%;
  height:100%;
  border:1px solid rgba(0,0,0,.12);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:12px;
  box-sizing:border-box;
}
.page img{
  max-width:100%;
  max-height:100%;
  width:100%;
  height:100%;
  object-fit:contain;
}
.left{border-radius:14px 0 0 14px;}
.right{border-radius:0 14px 14px 0;}
.controls{
  margin:12px 0;
  display:flex;
  gap:8px;
  align-items:center;
  justify-content:center;
  flex-wrap:wrap;
}
button{
  border:0;
  border-radius:999px;
  padding:10px 18px;
  background:#27364a;
  color:white;
  font-size:14px;
}
button:disabled{opacity:.35}
#counter{
  min-width:100px;
  text-align:center;
  color:#555;
}
.note{
  font-size:12px;
  color:#666;
  text-align:center;
  padding:0 12px 14px;
}
@media(max-width:760px){
  .viewer{
    width:94vw;
    height:74vh;
    display:block;
  }
  .page{
    width:100%;
    height:100%;
    border-radius:14px;
  }
  .left{display:none;}
}
</style>
</head>
<body>
<h1>UNLOCK Flipbook</h1>

<div class="viewer">
  <div class="page left" id="left"></div>
  <div class="page right" id="right"></div>
</div>

<div class="controls">
  <button id="prev">← 前へ</button>
  <span id="counter"></span>
  <button id="next">次へ →</button>
</div>

<div class="note">スマホは1ページ表示、PCは見開き表示です。</div>

<script>
const images = [
  "pages/01.png",
  "pages/02.png",
  "pages/03.png",
  "pages/04.png",
  "pages/05.png",
  "pages/06.png",
  "pages/07.png",
  "pages/08.png",
  "pages/09.png",
  "pages/10.png",
  "pages/11.png",
  "pages/裏表紙.png",
];

let current = 0;

const left = document.getElementById("left");
const right = document.getElementById("right");
const counter = document.getElementById("counter");
const prev = document.getElementById("prev");
const next = document.getElementById("next");

function isMobile(){
  return window.matchMedia("(max-width:760px)").matches;
}

function putImage(el, src){
  el.innerHTML = "";
  if(!src){
    el.innerHTML = "";
    return;
  }
  const img = document.createElement("img");
  img.src = src;
  img.alt = "";
  img.onerror = function(){
    el.innerHTML = "画像が見つかりません：" + src;
  };
  el.appendChild(img);
}

function render(){
  if(isMobile()){
    putImage(right, images[current]);
    counter.textContent = (current + 1) + " / " + images.length;
  }else{
    const leftIndex = current % 2 === 0 ? current : current - 1;
    putImage(left, images[leftIndex]);
    putImage(right, images[leftIndex + 1]);
    counter.textContent = (leftIndex + 1) + " - " + Math.min(leftIndex + 2, images.length) + " / " + images.length;
  }

  prev.disabled = current === 0;
  next.disabled = current >= images.length - 1;
}

next.onclick = function(){
  current += isMobile() ? 1 : 2;
  if(current >= images.length) current = images.length - 1;
  render();
};

prev.onclick = function(){
  current -= isMobile() ? 1 : 2;
  if(current < 0) current = 0;
  render();
};

document.addEventListener("keydown", function(e){
  if(e.key === "ArrowRight") next.click();
  if(e.key === "ArrowLeft") prev.click();
});

let startX = 0;
document.addEventListener("touchstart", function(e){
  startX = e.changedTouches[0].clientX;
}, {passive:true});

document.addEventListener("touchend", function(e){
  const endX = e.changedTouches[0].clientX;
  if(startX - endX > 50) next.click();
  if(endX - startX > 50) prev.click();
}, {passive:true});

window.addEventListener("resize", render);
render();
</script>
</body>
</html>
